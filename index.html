  <!DOCTYPE html>                                                                                                                                                                            
  <html>                                                                                                                                                                                     
  <head><title>OAuth Callback</title></head>
  <body>                                                                                                                                                                                     
  <h1>Authorization Code:</h1>                                                                                                                                                               
  <p id="code" style="font-size:18px;word-break:break-all;"></p>
  <script>                                                                                                                                                                                   
    const code = new URLSearchParams(window.location.search).get('code');                                                                                                                    
    document.getElementById('code').textContent = code || 'No code found in URL';
  </script>                                                                                                                                                                                  
  </body>                                                   
  </html>
